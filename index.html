<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barberia</title>
    <link rel="stylesheet" href="https://pro.fontawesome.com/releases/v5.10.0/css/all.css" />
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header class="header">
        <a href="index.html">
            <img src="img/125387735-barbería-vector-vintage-etiqueta-insignia-o-emblema-sobre-fondo-blanco-plantilla-de-vector.jpg" class="logo" alt="Barberia" width="100" height="100">
        </a>
        <div>
            <ul id="navbar" class="navbar">
                <li><a href="index.html">Galeria</a></li>
                <li><a href="#">Servicios</a></li>
                <li><a href="pages/contacto.html">Contacto</a></li>
            </ul>
        </div>
       
    </header>

    <main>

        <!-- ==================== HERO ==================== -->
        <section class="hero">
            <div class="hero-content">
                <h1>Tu estilo,nuestra pasion</h1>
                <h4>Desde cortes clasicos hasta modernos,cuidamos tu imagen con dedicacion</h4>
                <button>Reservar turno</button>
            </div>
        </section>

        <!-- ==================== cortes ==================== -->
        <section class="section-cortes">
            <h2>Cortes</h2>
            <div class="cortes-container">

                <div class="cortes">
                    <img src="img/peinado1.jpg" alt="peinado">
                    <div class="corte-descripcion">
                        <span>Corte</span>
                        <h5>Peinado de ondas</h5>
                        <h4>$10.000</h4>
                    </div>
                </div>

                <div class="cortes">
                    <img src="img/corte2.jpg" alt="Corte">
                    <div class="corte-descripcion">
                        <span>Corte</span>
                        <h5>Corte de pelo desordenado</h5>
                        <h4>$15.000</h4>
                    </div>
                </div>

                <div class="cortes">
                    <img src="img/corte3.jpg" alt="Corte">
                    <div class="corte-descripcion">
                        <span>Corte</span>
                        <h5>Taper con volumen</h5>
                        <h4>$12.000</h4>
                    </div>
                   
                </div>

                
            </div>
        </section>
</body>

</html>
